name: Build database.json

on:
  push:
    branches: [main]
    paths:
      - "motors/**"
      - "motor.schema.json"
      - "scripts/motordb.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-database
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build database.json from motors/
        run: python3 scripts/motordb.py build
      - name: Commit if changed
        run: |
          if git diff --quiet -- database.json; then
            echo "database.json already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add database.json
          git commit -m "Rebuild database.json from motors/"
          git push
