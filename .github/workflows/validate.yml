name: Validate motors

on:
  pull_request:
    paths:
      - "motors/**"
      - "motor.schema.json"
      - "scripts/motordb.py"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate motor files
        run: python3 scripts/motordb.py validate
